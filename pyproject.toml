[project]
name = "nova-rota-lakehouse"
version = "0.1.0"
description = "Lakehouse Bronze/Prata/Ouro para a Cooperativa NovaRota"
requires-python = ">=3.10,<3.13"
readme = "README.md"

dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "chispa>=0.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
